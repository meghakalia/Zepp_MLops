services:
  # ============================================================
  # Prefect - Pipeline Orchestration
  # UI: http://localhost:4200
  # ============================================================
  prefect:
    build:
      context: .
      dockerfile: docker/prefect/Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - PREFECT_API_URL=http://0.0.0.0:4200/api
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:4200/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # MLflow - Experiment Tracking + Model Registry
  # UI: http://localhost:5000
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Trainer - Model Training (CPU by default)
  # ============================================================
  trainer:
    build:
      context: .
      dockerfile: docker/trainer/Dockerfile
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    profiles:
      - training

  # ============================================================
  # Inference - FastAPI Prediction Server
  # API: http://localhost:8000
  # Docs: http://localhost:8000/docs
  # Metrics: http://localhost:8000/metrics
  # ============================================================
  inference:
    build:
      context: .
      dockerfile: docker/inference/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - MODEL_CHECKPOINT_DIR=/app/models/production/dual_head_no_weighted_loss
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - BIOCHARGE_FRESH_DATA_DIR=/app/data
      - BIOCHARGE_ZSCORES_FILE=/app/data/source/updated_z_score_user.json
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # Prometheus - Metrics Collection
  # UI: http://localhost:9090
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - inference
    restart: unless-stopped

  # ============================================================
  # Grafana - Dashboards & Visualization
  # UI: http://localhost:3000 (admin/admin)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/biocharge.json
    depends_on:
      - prometheus
    restart: unless-stopped
