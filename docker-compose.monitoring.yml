# Phase 2: Monitoring stack (Prometheus + Grafana)
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # ---- Unified alerting (enabled by default in Grafana 9+) ----
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false          # disable legacy alerting
      # ---- SMTP for email alerts ----
      # Copy .env.example → .env and fill in your SMTP credentials.
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-grafana@biocharge.local}
      - GF_SMTP_FROM_NAME=Biocharge Monitoring
      # ---- Alert recipient (used in contact-points.yaml) ----
      - GF_ALERT_EMAIL=${GF_ALERT_EMAIL:-ops@example.com}
    restart: unless-stopped
    depends_on:
      - prometheus
